name: psga_app
description: "Personal Security Guard App - A smart personal security application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # إدارة الحالة
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # التنقل
  go_router: ^13.0.0
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # UI
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  lucide_icons: 0.257.0

  # أدوات
  dartz: ^0.10.1
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3


  # Social Login
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # التخزين المحلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # الخرائط والموقع
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_polyline_points: ^2.0.1
  path_provider: ^2.1.5
  # الإشعارات
  flutter_local_notifications: ^16.3.0
  
  # الاتصال
  connectivity_plus: ^5.0.2
  
  # أخرى
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  image_picker: ^1.1.2
  firebase_storage: ^12.1.1
  permission_handler: ^11.1.0
  
  # Contact Management
  flutter_contacts: ^1.1.9
  
  # التقارير
  fl_chart: ^0.66.0
  pdf: ^3.10.7
  
  # HTTP
  http: ^1.1.2
  cloud_functions: ^5.6.2

  flutter_dotenv: ^5.2.1
  flutter_image_compress: ^2.4.0
  image_cropper: ^5.0.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # الترجمة
  generate: true
  
  # الأصول
  assets:
    - .env
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
